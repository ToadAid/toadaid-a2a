name: Agent Observatory Frontend

# R4-B: narrow, path-filtered frontend qualification for the observatory
# dashboard. Qualifies the actual reviewed commit (pull_request — never
# pull_request_target) with the committed lockfile. Read-only: no secrets are
# supplied to the frontend build, nothing is published, nothing is deployed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/observatory-dashboard/**'
      - 'apps/agent-hub/**'
      - 'agent_web/public_hub.py'
      - 'tools/serve_public_hub_preview.mjs'
      - 'tools/qualify_public_hub.py'
      - 'ops/toadaid-agent-pond.service.in'
      - '.github/workflows/agent-observatory-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/observatory-dashboard/**'
      - 'apps/agent-hub/**'
      - 'agent_web/public_hub.py'
      - 'tools/serve_public_hub_preview.mjs'
      - 'tools/qualify_public_hub.py'
      - 'ops/toadaid-agent-pond.service.in'
      - '.github/workflows/agent-observatory-frontend.yml'

permissions:
  contents: read

jobs:
  frontend-privacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js from committed configuration
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        working-directory: apps/observatory-dashboard
        run: npm ci
      - name: Run production build
        working-directory: apps/observatory-dashboard
        run: npm run build
      - name: Run frontend privacy and accessibility tests
        working-directory: apps/observatory-dashboard
        run: npm test
      - name: Install isolated Chromium
        working-directory: apps/observatory-dashboard
        run: npx playwright install --with-deps chromium
      - name: Qualify assembled Hub and Observatory subpath
        working-directory: apps/observatory-dashboard
        run: npm run test:hub
      - name: Qualify every release artifact through the static origin
        run: |
          python3 -m agent_web.public_hub build --output "$RUNNER_TEMP/agent-hub-release" --release-id agent-pond-ci
          read -r agent_hub_sha agent_hub_filename < "$RUNNER_TEMP/agent-hub-release/release-manifest.sha256"
          python3 -m tools.qualify_public_hub --release "$RUNNER_TEMP/agent-hub-release" --manifest-sha256 "$agent_hub_sha" --receipt "$RUNNER_TEMP/agent-hub-http-receipt.json"
