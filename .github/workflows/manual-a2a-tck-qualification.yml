name: A2A TCK — Manual Local Qualification (P0B-C2A)

# Manual only. NOT a PR requirement and NOT a claim of protocol certification.
on:
  workflow_dispatch:
    inputs:
      director_gate:
        description: "Type RUN_PINNED_TCK_LOCAL_ONLY after separate Director approval"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pinned-must-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"
      UV_NO_PROGRESS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      # A denied launch must fail visibly *before* checkout or third-party code.
      # Input is passed through the environment, not interpolated into bash.
      - name: Validate Director authorization before all other work
        id: director-gate
        shell: bash
        env:
          DIRECTOR_GATE: ${{ inputs.director_gate }}
        run: |
          set -uo pipefail
          if test "$GITHUB_REF" != 'refs/heads/main'; then
            echo '::error title=Director gate refused::Select protected main. No TCK executed.'
            exit 1
          fi
          if test "${DIRECTOR_GATE-}" != 'RUN_PINNED_TCK_LOCAL_ONLY'; then
            echo '::error title=Director gate refused::The approval text must match exactly. No TCK executed.'
            exit 1
          fi
          echo 'Director gate validated on main. Local test preparation may begin.'
      - name: Checkout protected main without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Choose known Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned uv tool
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.0"
      - name: Prepare evidence directory (no secrets or live journals)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/tck-evidence" || exit 1
          printf 'scope=JSONRPC-MUST-only; official conformance and deployment unapproved\n' > "${RUNNER_TEMP}/tck-evidence/SCOPE.txt"
          printf 'toadaid_source=%s\n' "$GITHUB_SHA" >> "${RUNNER_TEMP}/tck-evidence/SCOPE.txt"
      - name: Fetch and independently verify immutable upstream TCK
        shell: bash
        run: |
          set -uo pipefail
          git clone --quiet --no-checkout https://github.com/a2aproject/a2a-tck.git "${RUNNER_TEMP}/a2a-tck" || exit 1
          cd "${RUNNER_TEMP}/a2a-tck" || exit 1
          git checkout --quiet --detach d4d6fae7887f88ef607fb461c13e3b0e1802f19b || exit 1
          test "$(git rev-parse HEAD)" = "d4d6fae7887f88ef607fb461c13e3b0e1802f19b" || exit 1
          test "$(git rev-parse HEAD^{tree})" = "8469eb8aa083c027aa00a3107972b1787dc6671a" || exit 1
          test "$(git rev-parse HEAD:run_tck.py)" = "06f70520f89c2bb60e1f752694781141568ad08b" || exit 1
          test "$(git rev-parse HEAD:uv.lock)" = "9c17390a1441fb70d798baa8f4e71bc24fe95cdb" || exit 1
          test "$(git rev-parse HEAD:pyproject.toml)" = "3bb6059dbd68d3ce9e2dd01776077adebc7c5577" || exit 1
          test -z "$(git status --porcelain)" || exit 1
          printf 'upstream=%s\n' "$(git rev-parse HEAD)" >> "${RUNNER_TEMP}/tck-evidence/SCOPE.txt"
      - name: Install upstream locked dependencies on disposable hosted runner
        shell: bash
        working-directory: ${{ runner.temp }}/a2a-tck
        run: |
          set -uo pipefail
          uv sync --locked --no-dev || exit 1
      - name: Start synthetic A2A probe on IPv4 loopback only
        shell: bash
        run: |
          set -uo pipefail
          mkdir -m 700 "${RUNNER_TEMP}/a2a-probe-journal" || exit 1
          python3 -u -m agent_web.local_probe --journal-dir "${RUNNER_TEMP}/a2a-probe-journal" --port 0 > "${RUNNER_TEMP}/probe-banner.log" 2> "${RUNNER_TEMP}/probe-error.log" &
          echo "$!" > "${RUNNER_TEMP}/probe.pid"
          origin=""
          for i in $(seq 1 60); do
            if grep -Eq '^LOCAL_ONLY_NOT_DEPLOYED http://127\.0\.0\.1:[0-9]+/\.well-known/agent-card\.json$' "${RUNNER_TEMP}/probe-banner.log"; then
              origin="$(sed -n 's@^LOCAL_ONLY_NOT_DEPLOYED \(http://127\.0\.0\.1:[0-9]*\)/\.well-known/agent-card\.json$@\1@p' "${RUNNER_TEMP}/probe-banner.log" | head -n 1)"
              break
            fi
            kill -0 "$(cat "${RUNNER_TEMP}/probe.pid")" 2>/dev/null || exit 1
            sleep 0.25
          done
          test -n "$origin" || exit 1
          echo "SUT_ORIGIN=$origin" >> "$GITHUB_ENV"
      - name: Execute official pinned JSONRPC MUST tests and preserve failures
        id: official-tck
        shell: bash
        run: |
          set -uo pipefail
          report_root="${RUNNER_TEMP}/tck-evidence/reports"
          mkdir -p "$report_root" || exit 1
          rc=0
          (
            cd "${RUNNER_TEMP}/a2a-tck" || exit 1
            uv run --no-sync python run_tck.py --sut-host "$SUT_ORIGIN" --transport jsonrpc --level must
          ) > "${RUNNER_TEMP}/tck-evidence/raw-run.log" 2>&1 || rc=$?
          if test -d "${RUNNER_TEMP}/a2a-tck/reports"; then
            cp -R "${RUNNER_TEMP}/a2a-tck/reports/." "$report_root/" || exit 1
          fi
          python3 -m tools.tck_qualification_receipt --reports "$report_root" --return-code "$rc" --output "${RUNNER_TEMP}/tck-evidence/assessment.json" || exit 1
          printf 'official_tck_exit_code=%s\n' "$rc" >> "${RUNNER_TEMP}/tck-evidence/SCOPE.txt"
          if test "$rc" -ne 0; then
            echo "::error::Pinned upstream A2A TCK returned nonzero. FAIL/HOLD; raw evidence retained."
            exit "$rc"
          fi
          python3 - "${RUNNER_TEMP}/tck-evidence/assessment.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result = json.load(f)
          if result["verdict"] != "MUST_SUITE_PROVISIONAL_PASS_DIRECTOR_REVIEW_REQUIRED":
              print("FAIL/HOLD: missing or insufficient upstream TCK evidence")
              sys.exit(1)
          print("PROVISIONAL MUST-SUITE EVIDENCE ONLY — independent Director review required")
          PY
      - name: Stop synthetic loopback server
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if test -f "${RUNNER_TEMP}/probe.pid"; then
            pid="$(cat "${RUNNER_TEMP}/probe.pid")"
            kill "$pid" 2>/dev/null || :
            wait "$pid" 2>/dev/null || :
          fi
      - name: Preserve raw compatibility evidence even on failure
        # On denied launches no TCK work occurred, so no artifact should be made.
        # On *authorized* failed TCK, upload unmodified raw failure evidence.
        if: ${{ always() && steps.director-gate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2a-tck-p0b-c2a-local-raw-evidence
          path: ${{ runner.temp }}/tck-evidence/
          if-no-files-found: error
          retention-days: 7
